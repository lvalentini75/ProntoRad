name: xraynow
description: "ProntoRad è l'app definitiva per la Gen Z che rivoluziona la prenotazione di esami radiografici, offrendo un'esperienza utente elegante e intuitiva, ispirata allo stile iPhone 16."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  idb_shim: ^2.0.0
  http: ^1.0.0
  file_picker: '>=8.1.2'
  printing: ^5.0.0
  pdf: ^3.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  shared_preferences: ^2.2.2
  intl: 0.20.2
  geolocator: 13.0.4
  permission_handler: ^12.0.0
  supabase_flutter: 2.3.0
  table_calendar: ^3.0.0
  flutter_secure_storage: ^10.0.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
